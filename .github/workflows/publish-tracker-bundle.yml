name: Publish Maschine Tracker bundle

on:
  push:
    branches:
      - main
    paths:
      - '.tracker-bootstrap/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand tracker bundle
        shell: python
        run: |
          from pathlib import Path
          import base64
          import zipfile

          root = Path('.')
          parts = sorted((root / '.tracker-bootstrap').glob('part*.b64'))
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          archive = root / '.tracker-bootstrap' / 'tracker_publish_bundle.zip'
          archive.write_bytes(base64.b64decode(encoded))
          with zipfile.ZipFile(archive, 'r') as zf:
              zf.extractall(root)

      - name: Remove bootstrap files
        run: |
          rm -rf .tracker-bootstrap
          rm -f .github/workflows/publish-tracker-bundle.yml

      - name: Commit published tracker tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Maschine Tracker V0.45.5"
            git push
          fi
